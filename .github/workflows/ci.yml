name: CI

# Pull requests only: pushes to `main` and `release/**` are built, tested, and published by `publish.yml`.
on:
  pull_request:
    branches: [ "main", "release/**" ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    # The build must run on Windows so that .NET Framework targets can be built and tested.
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          # `Build.ps1` plans versions by comparing each package with its release tag.
          fetch-depth: 0
          fetch-tags: true
      - name: Setup
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          # Runtimes for the test target frameworks; the SDK version comes from `global.json`.
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Build
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: true
        shell: pwsh
        run: |
          ./Build.ps1
